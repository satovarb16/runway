name: Release

# Publishing is irreversible: PyPI never lets a version number be reused, even
# after a delete. So everything that can fail runs BEFORE the upload, and the
# upload itself sits behind a protected environment.
on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # This repo carries the version in FOUR files and they have drifted before:
      # 0.3.0 sat in pyproject/manifest while the plugin still pinned 0.1.2, so
      # every plugin install kept pulling the old package. A tag that disagrees
      # with any of them publishes something other than what the tag claims — and
      # there is no taking it back. The plugin pin matters most: it is the version
      # users actually run.
      - name: Tag, package and plugin versions must all agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          MAN=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('manifest.json').read_text(encoding='utf-8'))['version'])")
          PLG=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('plugins/runway-mcp/.claude-plugin/plugin.json').read_text(encoding='utf-8'))['version'])")
          # The pin is either a PyPI spec (runway-mcp==X.Y.Z) or a git ref
          # (git+https://...@vX.Y.Z); both end in the version, so match either.
          PIN=$(python -c "import json,pathlib,re,sys;spec=json.loads(pathlib.Path('plugins/runway-mcp/.mcp.json').read_text(encoding='utf-8'))['mcpServers']['runway-mcp']['args'][1];m=re.search(r'(?:==|@v?)([0-9]+[.][0-9]+[.][0-9]+)\$',spec);print(m.group(1) if m else sys.exit('cannot read a version out of the plugin pin: '+spec))")
          echo "tag=$TAG pyproject=$PKG manifest=$MAN plugin=$PLG pin=$PIN"
          for v in "$PKG" "$MAN" "$PLG" "$PIN"; do
            if [ "$TAG" != "$v" ]; then
              echo "::error::version mismatch — tag=$TAG pyproject=$PKG manifest=$MAN plugin=$PLG pin=$PIN"
              exit 1
            fi
          done

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Run tests
        run: pytest

  publish:
    needs: verify
    runs-on: ubuntu-latest

    # PyPI publishing is switched OFF at the repo, not commented out here: the
    # Trusted Publishing publisher was never configured and the account's 2FA is
    # lost, so this job fails with `invalid-publisher` on every single tag and
    # paints a red X on a release that is otherwise fine. A skipped job is grey
    # and honest; a failing one trains you to ignore the check.
    # To turn publishing back on, set the repository variable
    # PYPI_PUBLISH_ENABLED to "true" (Settings -> Secrets and variables ->
    # Actions -> Variables) once the publisher exists. No code change, no PR.
    if: vars.PYPI_PUBLISH_ENABLED == 'true'

    # Trusted Publishing: PyPI verifies this workflow's OIDC identity instead of
    # a long-lived API token, so there is no secret to leak or rotate. Requires a
    # one-time pending publisher configured on PyPI — see the README release note.
    permissions:
      id-token: write
      contents: read

    # Add required reviewers to this environment in the repo settings to gate the
    # upload behind a manual approval.
    environment:
      name: pypi
      url: https://pypi.org/p/runway-mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      # Catches a malformed description or bad metadata before the upload rather
      # than after, when the version is already burned.
      - name: Check the built artifacts
        run: |
          pip install twine
          twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
