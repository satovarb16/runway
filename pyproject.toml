[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runway-mcp"
version = "0.4.0"
description = "An MCP server that remembers your job hunt: applications, statuses, and which resume version you sent to each job — plus a live work-authorization warning."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "satovarb" }]
keywords = ["mcp", "job-search", "resume", "application-tracker", "work-authorization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp>=1.2,<2",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/satovarb16/runwayMCP"
Repository = "https://github.com/satovarb16/runwayMCP"
Issues = "https://github.com/satovarb16/runwayMCP/issues"

[project.scripts]
runway-mcp = "server:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "ruff==0.15.18",
]

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: contract tests that pin the Pydantic output shape",
    "integration: tests that launch or import the full server",
]
